schema: spec-driven

context: |
  Project: QuackDoku, an early asset-only repository for a mobile Android/iOS MVP.
  Product direction: 8/16-bit duck murder mystery with deduction inspired by Murdoku.
  Current implementation: no application scaffold detected; existing assets are under assets/.
  Architecture: not yet selected; resolve during exploration and design.
  Repository: no local Git repository detected; remote URL is informational only.
  Testing: no test runner or quality tool detected; Strict TDD is disabled.

strict_tdd: false

testing:
  runner: null
  framework: null
  unit: null
  integration: null
  e2e: null
  coverage: null
  linter: null
  type_checker: null
  formatter: null

rules:
  proposal:
    - State MVP assumptions, retention hypotheses, and rollback criteria.
    - Do not implement functionality during exploration or proposal work.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Compare mobile technology options before selecting one.
    - Document architecture decisions with rationale and tradeoffs.
  tasks:
    - Group tasks by phase and keep each task completable in one session.
  apply:
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
